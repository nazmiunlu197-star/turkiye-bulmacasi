<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Türkiye Bulmacası</title>
<link rel="stylesheet" href="styles.css?v=28">
</head>
<body>
<div class="app" id="app">
  <main id="home" class="reference-screen">
    <img class="reference-image" src="file_0000000095d881f4a1713e208409ffb4.png" alt="Türkiye Bulmacası ana ekranı">
    <button class="hotspot home-settings" data-action="settings"></button>\n    <button class="hotspot home-store" data-action="store" aria-label="Mağaza"></button>
    <button class="hotspot home-daily" data-action="daily"></button>
    <button class="hotspot home-istanbul" data-action="istanbul"></button>
    <button class="hotspot home-ankara" data-action="ankara"></button>
    <button class="hotspot home-izmir" data-action="izmir"></button>
    <button class="hotspot home-old" data-action="old"></button>
    <button class="hotspot home-anatolia" data-action="anatolia"></button>
    <button class="hotspot home-culture" data-action="culture"></button>
    <div class="main-bottom-nav-bg" aria-hidden="true"></div>
    <nav class="main-bottom-nav" aria-label="Ana menü">
      <button data-action="home" class="active"><span class="nav-icon">⌂</span><span>Ana Sayfa</span></button>
      <button data-action="daily"><span class="nav-icon">▣</span><span>Günlük</span></button>
      <button data-action="progress"><span class="nav-icon">▥</span><span>İlerleme</span></button>
      <button data-action="achievements"><span class="nav-icon">♛</span><span>Başarılar</span></button>
      <button data-action="collection"><span class="nav-icon">★</span><span>Koleksiyon</span></button>
      <button data-action="profile"><span class="nav-icon">◉</span><span>Profilim</span></button>
    </nav>
  </main>
  <section id="istanbulScreen" class="reference-screen" hidden>
    <img class="reference-image" src="file_0000000091ec821083759393667ca560.png" alt="İstanbul Bulmacası - 1 ekranı">
    <div id="istanbulPlayable" class="istanbul-playable" aria-label="Oynanabilir İstanbul bulmacası">
      <div class="cw-word cw-1" data-answer="GALATA" data-number="1"></div>
      <div class="cw-word cw-4" data-answer="BOĞAZİÇİ" data-number="4"></div>
      <div class="cw-word cw-6" data-answer="BALAT" data-number="6"></div>
      <div class="cw-word cw-7" data-answer="TOPKAPI" data-number="7"></div>
      <div class="cw-word cw-8" data-answer="TAKSİM" data-number="8"></div>
      <button id="cwHint" class="cw-side cw-hint" type="button">İpucu</button>
      <button id="cwLetter" class="cw-side cw-letter" type="button">Harf Aç</button>
      <button id="cwWord" class="cw-side cw-word-open" type="button">Kelime Aç</button>
      <button id="cwCheck" class="cw-check" type="button">Kontrol</button>
      <div id="cwMessage" class="cw-message" aria-live="polite"></div>
      <div id="cwKeyboard" class="cw-keyboard"></div>
    </div>
    <button class="hotspot istanbul-back" data-action="home" aria-label="Geri"></button>
    <button class="hotspot istanbul-nav-home" data-action="home"></button>
    <button class="hotspot istanbul-nav-daily" data-action="daily"></button>
    <button class="hotspot istanbul-nav-progress" data-action="progress"></button>
    <button class="hotspot istanbul-nav-collection" data-action="collection"></button>
    <button class="hotspot istanbul-nav-profile" data-action="profile"></button>
  </section>

  <section id="dailyScreen" class="reference-screen" hidden>
    <img class="reference-image" src="file_00000000643882109c5b6ce3407e10cd.jpg" alt="Günlük Bulmaca ekranı">
    <button class="hotspot daily-back" data-action="home"></button>
    <button class="hotspot daily-play" data-action="daily-play"></button>
    <button class="hotspot daily-nav-home" data-action="home"></button>
    <button class="hotspot daily-nav-daily" data-action="daily"></button>
    <button class="hotspot daily-nav-progress" data-action="progress"></button>
    <button class="hotspot daily-nav-collection" data-action="collection"></button>
    <button class="hotspot daily-nav-profile" data-action="profile"></button>
  </section>

  <section id="progressScreen" class="reference-screen" hidden>
    <img class="reference-image" src="file_00000000578881f4a9fc0fc4775a3a3a.jpg" alt="İlerleme ekranı">
    <button class="hotspot progress-back" data-action="home"></button>
    <button class="hotspot progress-nav-home" data-action="home"></button>
    <button class="hotspot progress-nav-daily" data-action="daily"></button>
    <button class="hotspot progress-nav-progress" data-action="progress"></button>
    <button class="hotspot progress-nav-collection" data-action="collection"></button>
    <button class="hotspot progress-nav-profile" data-action="profile"></button>
  </section>

  <section id="collectionScreen" class="reference-screen" hidden>
    <img class="reference-image" src="file_0000000038508210817f51c0db0e6023.png" alt="Koleksiyon ekranı">
    <button class="hotspot collection-back" data-action="home"></button>
    <button class="hotspot collection-nav-home" data-action="home"></button>
    <button class="hotspot collection-nav-daily" data-action="daily"></button>
    <button class="hotspot collection-nav-progress" data-action="progress"></button>
    <button class="hotspot collection-nav-collection" data-action="collection"></button>
    <button class="hotspot collection-nav-profile" data-action="profile"></button>
  </section>

  <section id="achievementsScreen" class="reference-screen" hidden>
    <img class="reference-image" src="file_00000000d8348210aa8429be7455cc1a.png" alt="Başarılar ekranı">
    <button class="hotspot achievements-back" data-action="home"></button>
    <button class="hotspot achievements-nav-home" data-action="home"></button>
    <button class="hotspot achievements-nav-daily" data-action="daily"></button>
    <button class="hotspot achievements-nav-progress" data-action="progress"></button>
    <button class="hotspot achievements-nav-collection" data-action="collection"></button>
    <button class="hotspot achievements-nav-achievements" data-action="achievements"></button>
  </section>

  <section id="settingsScreen" class="reference-screen settings-screen" hidden>
    <img class="reference-image" src="file_000000003e988210879971eccb5a920b.jpg" alt="Ayarlar ekranı">
    <button class="hotspot settings-back" data-action="home"></button>
    <button class="hotspot settings-nav-home" data-action="home"></button>
    <button class="hotspot settings-nav-daily" data-action="daily"></button>
    <button class="hotspot settings-nav-progress" data-action="progress"></button>
    <button class="hotspot settings-nav-collection" data-action="collection"></button>
    <button class="hotspot settings-nav-achievements" data-action="achievements"></button>
    <button class="hotspot settings-nav-profile" data-action="profile"></button>
  </section>

  <section id="profileScreen" class="reference-screen" hidden>
    <img class="reference-image" src="file_0000000088d08210b8015dc967623da1.jpg" alt="Profilim ekranı">
    <button class="hotspot profile-back" data-action="home" aria-label="Geri"></button>

    <div class="profile-name-wrap">
      <span id="profileNameDisplay" class="profile-name-display"></span>
      <button id="editProfileName" class="profile-name-edit" type="button" aria-label="İsmi düzenle">✎</button>
    </div>

    <button class="hotspot profile-achievements" data-action="achievements" aria-label="Başarılarım"></button>
    <button class="hotspot profile-progress" data-action="progress" aria-label="İstatistiklerim"></button>
    <button class="hotspot profile-collection" data-action="collection" aria-label="Koleksiyonum"></button>
    <button class="hotspot profile-settings" data-action="settings" aria-label="Ayarlar"></button>

    <button class="hotspot profile-nav-home" data-action="home"></button>
    <button class="hotspot profile-nav-daily" data-action="daily"></button>
    <button class="hotspot profile-nav-progress" data-action="progress"></button>
    <button class="hotspot profile-nav-collection" data-action="collection"></button>
    <button class="hotspot profile-nav-profile" data-action="profile"></button>
  </section>

  <section class="placeholder" id="placeholder" hidden>
    <button class="back" data-action="home">← Ana Sayfa</button>
    <div class="paper">
      <h2 id="placeholderTitle">Yakında</h2>
      <p>Bu ekranı onaylanan tasarıma göre sırayla bağlıyoruz.</p>
    </div>
  </section>
</div>
<script src="app.js?v=28"></script>
</body>
</html>
