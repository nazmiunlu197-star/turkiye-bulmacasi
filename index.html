<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Türkiye Bulmacası</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <main id="home" class="reference-home" aria-label="Türkiye Bulmacası ana ekranı">
    <img class="reference-image" src="file_0000000095d881f4a1713e208409ffb4.png" alt="Türkiye Bulmacası">

    <button class="hotspot settings" data-action="settings" aria-label="Ayarlar"></button>
    <button class="hotspot daily" data-action="daily" aria-label="Günün Bulmacası"></button>
    <button class="hotspot journey" data-action="journey" aria-label="Türkiye Yolculuğu"></button>

    <button class="hotspot istanbul" data-action="istanbul" aria-label="İstanbul Bulmacaları"></button>
    <button class="hotspot ankara" data-action="ankara" aria-label="Ankara Bulmacaları"></button>
    <button class="hotspot izmir" data-action="izmir" aria-label="İzmir Bulmacaları"></button>
    <button class="hotspot old" data-action="old" aria-label="Eski Türkiye Bulmacaları"></button>
    <button class="hotspot anatolia" data-action="anatolia" aria-label="Anadolu Bulmacaları"></button>
    <button class="hotspot culture" data-action="culture" aria-label="Kültür ve Yaşam Bulmacaları"></button>

    <button class="hotspot nav-home" data-action="home" aria-label="Ana Sayfa"></button>
    <button class="hotspot nav-daily" data-action="daily" aria-label="Günlük Bulmaca"></button>
    <button class="hotspot nav-progress" data-action="progress" aria-label="İlerleme"></button>
    <button class="hotspot nav-collection" data-action="collection" aria-label="Koleksiyon"></button>
    <button class="hotspot nav-profile" data-action="profile" aria-label="Profil"></button>
  </main>

  <section class="placeholder" id="placeholder" hidden>
    <button class="back" data-action="home">← Ana Sayfa</button>
    <div class="paper">
      <h2 id="placeholderTitle">Yakında</h2>
      <p>Bu ekranı onaylanan tasarıma göre sırayla bağlıyoruz.</p>
    </div>
  </section>
</div>
<script src="app.js"></script>
</body>
</html>
