<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Türkiye Bulmacası</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <main id="home" class="reference-screen" aria-label="Türkiye Bulmacası ana ekranı">
    <img class="reference-image" src="file_0000000095d881f4a1713e208409ffb4.png" alt="Türkiye Bulmacası ana ekranı">

    <button class="hotspot home-settings" data-action="settings" aria-label="Ayarlar"></button>
    <button class="hotspot home-daily" data-action="daily" aria-label="Günün Bulmacası"></button>
    <button class="hotspot home-journey" data-action="journey" aria-label="Türkiye Yolculuğu"></button>

    <button class="hotspot home-istanbul" data-action="istanbul" aria-label="İstanbul Bulmacaları"></button>
    <button class="hotspot home-ankara" data-action="ankara" aria-label="Ankara Bulmacaları"></button>
    <button class="hotspot home-izmir" data-action="izmir" aria-label="İzmir Bulmacaları"></button>
    <button class="hotspot home-old" data-action="old" aria-label="Eski Türkiye Bulmacaları"></button>
    <button class="hotspot home-anatolia" data-action="anatolia" aria-label="Anadolu Bulmacaları"></button>
    <button class="hotspot home-culture" data-action="culture" aria-label="Kültür ve Yaşam Bulmacaları"></button>

    <button class="hotspot home-nav-home" data-action="home" aria-label="Ana Sayfa"></button>
    <button class="hotspot home-nav-daily" data-action="daily" aria-label="Günlük"></button>
    <button class="hotspot home-nav-progress" data-action="progress" aria-label="İlerleme"></button>
    <button class="hotspot home-nav-collection" data-action="collection" aria-label="Koleksiyon"></button>
    <button class="hotspot home-nav-achievements" data-action="achievements" aria-label="Başarılar"></button>
  </main>

  <section id="collectionScreen" class="reference-screen" hidden aria-label="Koleksiyon ekranı">
    <img class="reference-image" src="file_0000000038508210817f51c0db0e6023.png" alt="Türkiye Bulmacası Koleksiyon ekranı">
    <button class="hotspot collection-back" data-action="home" aria-label="Geri"></button>
    <button class="hotspot collection-nav-home" data-action="home" aria-label="Ana Sayfa"></button>
    <button class="hotspot collection-nav-daily" data-action="daily" aria-label="Günlük"></button>
    <button class="hotspot collection-nav-progress" data-action="progress" aria-label="İlerleme"></button>
    <button class="hotspot collection-nav-collection" data-action="collection" aria-label="Koleksiyon"></button>
    <button class="hotspot collection-nav-profile" data-action="profile" aria-label="Profilim"></button>
  </section>

  <section id="achievementsScreen" class="reference-screen" hidden aria-label="Başarılar ekranı">
    <img class="reference-image" src="file_00000000d8348210aa8429be7455cc1a.png" alt="Türkiye Bulmacası Başarılar ekranı">
    <button class="hotspot achievements-back" data-action="home" aria-label="Geri"></button>
    <button class="hotspot achievements-nav-home" data-action="home" aria-label="Ana Sayfa"></button>
    <button class="hotspot achievements-nav-daily" data-action="daily" aria-label="Günlük"></button>
    <button class="hotspot achievements-nav-progress" data-action="progress" aria-label="İlerleme"></button>
    <button class="hotspot achievements-nav-collection" data-action="collection" aria-label="Koleksiyon"></button>
    <button class="hotspot achievements-nav-achievements" data-action="achievements" aria-label="Başarılar"></button>
  </section>

  <section class="placeholder" id="placeholder" hidden>
    <button class="back" data-action="home">← Ana Sayfa</button>
    <div class="paper">
      <h2 id="placeholderTitle">Yakında</h2>
      <p>Bu ekranı onaylanan tasarıma göre sırayla bağlıyoruz.</p>
    </div>
  </section>
</div>
<script src="app.js"></script>
</body>
</html>
