function validatePuzzleData(p){
 const occupied=new Map(), errors=[];
 for(const w of p.words){
  const chars=[...normalize(w.answer)];
  if(chars.length!==w.cells.length)errors.push(`${w.id}: cevap uzunluğu hücre sayısıyla uyuşmuyor`);
  w.cells.forEach(([r,c],i)=>{
   if(r<0||r>7||c<0||c>9||!(p.pattern||BASE_PATTERN)[r]||(p.pattern||BASE_PATTERN)[r][c]==='#')errors.push(`${w.id}: geçersiz hücre ${r},${c}`);
   const k=`${r},${c}`,ch=chars[i];
   if(occupied.has(k)&&occupied.get(k)!==ch)errors.push(`${w.id}: kesişim hatası ${k}`); else occupied.set(k,ch);
  });
 }
 return errors;
}

function fallbackWord(cell,dir){const r=+cell.dataset.r,c=+cell.dataset.c;if(pattern[r][c]==='#')return null;let cells=[];if(dir==='across'){let a=c;while(a>0&&pattern[r][a-1]!=='#')a--;let b=c;while(b<9&&pattern[r][b+1]!=='#')b++;for(let x=a;x<=b;x++)cells.push([r,x])}else{let a=r;while(a>0&&pattern[a-1][c]!=='#')a--;let b=r;while(b<7&&pattern[b+1][c]!=='#')b++;for(let y=a;y<=b;y++)cells.push([y,c])}return {id:'FREE',dir,cells,answer:null,clue:''}}

  try{localStorage.setItem('tb_last_star_txn',JSON.stringify({reason,cost,before,after,at:Date.now()}))}catch(e){}
  return true;
}
function game(){puzzleCompleted=false;persistSave();const puzzle=gameMode==='general'?(GENERAL_PUZZLES[generalNumber]||GENERAL_PUZZLES[1]):(PUZZLES[currentPuzzle]||PUZZLES[1]);pattern=puzzle.pattern||BASE_PATTERN;WORDS=puzzle.words;bg.src=GAME;let h='<button class="hot back"></button><div class="sourceCover"></div><div class="starcount">${stars}</div><div class="grid">';for(let r=0;r<8;r++)for(let c=0;c<10;c++){let b=pattern[r][c]=='#';h+=`<div class="cell ${b?'block':''}" data-r="${r}" data-c="${c}"></div>`}h+='</div><button class="hint" aria-label="İpucu"></button><button class="letterhint" aria-label="Harf Aç"></button><button class="wordhint" aria-label="Kelime Aç"></button><div class="cluecover left">'+WORDS.filter(w=>w.dir==='across').map(w=>`<div>${w.id.replace('A','')}. ${w.clue}</div>`).join('')+'</div><div class="cluecover right">'+WORDS.filter(w=>w.dir==='down').map(w=>`<div>${w.id.replace('D','')}. ${w.clue}</div>`).join('')+'</div><div class="keyboardCover"></div><div class="keys">';const rows=[['Q','W','E','R','T','Y','U','I','O','P','Ğ','Ü'],['A','S','D','F','G','H','J','K','L','Ş','İ'],['Z','X','C','V','B','N','M','Ö','Ç','BACKSPACE']];rows.forEach((row,ri)=>{h+=`<div class="keyrow r${ri+1}">`;for(const k of row){const isBack=k==='BACKSPACE';h+=`<button type="button" class="key ${isBack?'backspace':''}" data-k="${k}" aria-label="${isBack?'Sil':k}">${isBack?'⌫':k}</button>`}h+='</div>'});h+='</div><div class="bottomPanelGuard"></div>';h+=`<div class="puzzleTitle2"><b>${gameMode==='general'?'Genel Kültür':'İstanbul'}</b>Bulmacası - ${gameMode==='general'?generalNumber:currentPuzzle}</div>`;ui.innerHTML=h;ui.querySelector('.back').onclick=home;ui.querySelectorAll('.cell:not(.block)').forEach(x=>x.onclick=()=>tapCell(x));ui.querySelectorAll('.key').forEach(x=>{x.onclick=null;x.onpointerup=(e)=>{e.preventDefault();e.stopPropagation();press(x.dataset.k)}});const bindOnce=(el,fn)=>{el.onclick=null;el.ontouchstart=null;el.onpointerup=(e)=>{e.preventDefault();e.stopPropagation();fn()}};bindOnce(ui.querySelector('.hint'),useHint);bindOnce(ui.querySelector('.letterhint'),revealLetter);bindOnce(ui.querySelector('.wordhint'),revealWord);

function tapCell(x){

function puzzleIsSolved(){return WORDS.every(w=>{const cs=cellsFor(w);return cs.length===w.answer.length && normalize(cs.map(c=>c.textContent).join(''))===normalize(w.answer)})}
function checkPuzzleComplete(){

function checkActive(){if(!activeDef||!activeDef.answer)return false;const cs=cellsFor(activeDef);if(cs.some(c=>!c.textContent))return false;cs.forEach(c=>c.classList.remove('ok','bad'));const typed=normalize(cs.map(c=>c.textContent).join(''));if(typed===normalize(activeDef.answer)){cs.forEach(c=>c.classList.add('ok'));msg('Doğru! ✓');setTimeout(checkPuzzleComplete,250);return true}cs.forEach(c=>c.classList.add('bad'));msg('Henüz doğru değil.');setTimeout(()=>cs.forEach(c=>c.classList.remove('bad')),650);return false}

function ensureHintWord(){if(activeDef&&activeDef.answer)return activeDef;const w=WORDS.find(w=>cellsFor(w).some(c=>!c.textContent));if(w){activeDef=w;direction=w.dir;const cs=cellsFor(w);cs.forEach(c=>c.classList.add('word'));if(cs[0]){selected=cs[0];cs[0].classList.add('sel')}}return w||null}let lastLetterHintAt=0, hintActionBusy=false;
